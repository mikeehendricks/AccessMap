{% extends "base.html" %}
{% block title %}Sign in — AccessMap{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Sign in</h1>
  <p class="muted">Admin sign-in for the AccessMap panel.</p>
  <form method="post" action="{{ url_for('auth.login') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Username
      <input name="username" type="text" required autocomplete="username"
             value="{{ username or '' }}">
    </label>
    <label>Password
      <input name="password" type="password" required autocomplete="current-password">
    </label>
    <button class="btn btn-primary" type="submit">Sign in</button>
  </form>
  <p class="muted small">First time here? <a href="{{ url_for('auth.register') }}">Create the first admin account</a> (one-time only).</p>
</section>
{% endblock %}
