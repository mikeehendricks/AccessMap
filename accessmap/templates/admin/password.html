{% extends "base.html" %}
{% block title %}Change password — AccessMap{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Change my password</h1>
  <form method="post" action="{{ url_for('admin.change_password') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Current password
      <input name="old_password" type="password" required autocomplete="current-password">
    </label>
    <label>New password (min 10 chars, letters + digits)
      <input name="new_password" type="password" required minlength="10" autocomplete="new-password">
    </label>
    <label>Confirm new password
      <input name="confirm" type="password" required autocomplete="new-password">
    </label>
    <button class="btn btn-primary" type="submit">Change password</button>
  </form>
</section>
{% endblock %}
